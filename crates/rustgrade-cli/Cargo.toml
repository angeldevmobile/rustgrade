[package]
# Published as `rustgrade` so `cargo install rustgrade` works.
name = "rustgrade"
description = "Systems-level Rust review for AI coding agents and for CI."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "../../README.md"
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rustgrade"
path = "src/main.rs"

[dependencies]
rustgrade-core.workspace = true
anyhow.workspace = true
clap.workspace = true
ignore = "0.4"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[lints]
workspace = true

# Prebuilt binaries from .github/workflows/release.yml, for `cargo binstall rustgrade`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
