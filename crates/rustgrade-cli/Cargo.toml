[package]
# Published as `rustgrade` so `cargo install rustgrade` works.
name = "rustgrade"
description = "Systems-level Rust review for AI coding agents and for CI."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "rustgrade"
path = "src/main.rs"

[features]
mcp = ["dep:rustgrade-mcp"]

[dependencies]
rustgrade-core.workspace = true
rustgrade-mcp = { workspace = true, optional = true }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true

[lints]
workspace = true
