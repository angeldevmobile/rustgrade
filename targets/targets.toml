# Where each coding agent reads the rustgrade skill and commands.
# `rustgrade install` embeds this file at build time; adding an agent or fixing
# a moved path needs no Rust changes.
#
# Paths are relative to the install root: the project directory with
# `--scope project` (default) or the home directory with `--scope user`.
#   skill_dir           the skill, for both scopes
#   commands_dir        commands with --scope project
#   user_commands_dir   commands with --scope user (absent: none at user scope)
#   commands_format     how commands/*.md is translated:
#                         claude          copied as-is ($ARGUMENTS kept)
#                         plain           Markdown, no frontmatter
#                         gemini-toml     TOML with description + prompt, {{args}}
#                         copilot-prompt  .prompt.md with Copilot frontmatter
#   instructions_file       file read on every request (CLAUDE.md, AGENTS.md...)
#                           that gets the rustgrade section, --scope project
#   user_instructions_file  the same for --scope user (absent: none)
# An agent counts as installed (for `--agent all` and `doctor`) if any `detect`
# path exists under the home directory, or any `detect_commands` executable is
# on PATH. Use commands where a folder is ambiguous: ~/.gemini is also created
# by Antigravity and Gemini Code Assist, ~/.codeium/windsurf by the Codeium
# editor extension.
#
# `.agents/skills/` is read by Codex, Cursor, Gemini CLI, Copilot (VS Code) and
# Windsurf, so those agents share one copy of the skill.
#
# Sources, checked 2026-10-28:
#   Claude Code  https://code.claude.com/docs/en/skills
#   Codex CLI    https://learn.chatgpt.com/docs/build-skills
#   Cursor       https://cursor.com/docs/skills, https://docs.cursor.com/en/agent/chat/commands
#   Gemini CLI   https://geminicli.com/docs/cli/skills/, https://geminicli.com/docs/cli/custom-commands/
#   Copilot      https://code.visualstudio.com/docs/agent-customization/agent-skills,
#                https://code.visualstudio.com/docs/copilot/customization/prompt-files
#   Windsurf     https://docs.devin.ai/desktop/cascade/skills, https://docs.devin.ai/desktop/cascade/workflows

[[agent]]
id = "claude"
name = "Claude Code"
detect = [".claude"]
skill_dir = ".claude/skills/rustgrade"
commands_dir = ".claude/commands"
user_commands_dir = ".claude/commands"
commands_format = "claude"
instructions_file = "CLAUDE.md"
user_instructions_file = ".claude/CLAUDE.md"

[[agent]]
id = "codex"
name = "Codex CLI"
detect = [".codex"]
skill_dir = ".agents/skills/rustgrade"
# Codex documents skills only; ask it for "a rustgrade audit".
instructions_file = "AGENTS.md"
user_instructions_file = ".codex/AGENTS.md"

[[agent]]
id = "cursor"
name = "Cursor"
detect = [".cursor"]
detect_commands = ["cursor"]
skill_dir = ".agents/skills/rustgrade"
commands_dir = ".cursor/commands"
user_commands_dir = ".cursor/commands"
commands_format = "plain"
# User rules live in Cursor's settings, not in a file.
instructions_file = "AGENTS.md"

[[agent]]
id = "gemini"
name = "Gemini CLI"
detect = []
detect_commands = ["gemini"]
skill_dir = ".agents/skills/rustgrade"
commands_dir = ".gemini/commands"
user_commands_dir = ".gemini/commands"
commands_format = "gemini-toml"
instructions_file = "GEMINI.md"
user_instructions_file = ".gemini/GEMINI.md"

[[agent]]
id = "copilot"
name = "GitHub Copilot (VS Code)"
detect = [".copilot"]
skill_dir = ".agents/skills/rustgrade"
# User-level prompt files live in VS Code's profile data, not under home.
commands_dir = ".github/prompts"
commands_format = "copilot-prompt"
instructions_file = ".github/copilot-instructions.md"

[[agent]]
id = "windsurf"
name = "Windsurf (Devin Desktop)"
detect = [".config/devin"]
detect_commands = ["windsurf", "devin"]
skill_dir = ".agents/skills/rustgrade"
commands_dir = ".devin/workflows"
user_commands_dir = ".codeium/windsurf/global_workflows"
commands_format = "plain"
instructions_file = "AGENTS.md"
