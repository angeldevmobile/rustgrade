[workspace]
resolver = "2"
members = ["crates/rustgrade-core", "crates/rustgrade-cli", "crates/rustgrade-mcp"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"  # let-chains
repository = "https://github.com/angeldevmobile/rustgrade"
keywords = ["rust", "lint", "code-review", "static-analysis", "ai"]

[workspace.dependencies]
# crates.io needs a version next to `path`; keep it equal to `version` above.
rustgrade-core = { path = "crates/rustgrade-core", version = "0.3.0" }
rustgrade-mcp = { path = "crates/rustgrade-mcp", version = "0.3.0" }
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

# Release binaries (release.yml): smaller and a bit faster, slower to build, so
# `cargo install` keeps the default release profile.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
